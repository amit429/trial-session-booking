      <div class="field"><label for="af-scope">When</label><select class="select" id="af-scope" data-filter="scope"><option value="upcoming">Upcoming</option><option value="past">Past</option><option value="all">All</option></select></div>
      <div class="field"><label for="af-status">Status</label><select class="select" id="af-status" data-filter="status"><option value="">Any</option><option value="CONFIRMED">Confirmed</option><option value="CANCELLED">Cancelled</option></select></div>
      <div class="field"><label for="af-mentor">Mentor</label><select class="select" id="af-mentor" data-filter="mentor"><option value="">All mentors</option>${MENTORS.map(m => `<option value="${m.id}">${esc(m.name)}</option>`).join("")}</select></div>
      <div class="field" style="flex:1;min-width:220px"><label for="af-q">Search</label><input class="input" id="af-q" data-filter="q" placeholder="Reference, parent, email or child" value="${esc(F.q)}"></div></div>
    ${bookingTable(rows)}`);
}
function viewAdminParents() {
  const list = Object.values(DB.parents).filter(p => !p.email.startsWith("ghost")).sort((a, b) => a.name.localeCompare(b.name));
  return adminShell("parents", `<div class="stack" style="gap:4px"><h1>Parents</h1><p class="muted">Guest = booked without an account. Pending = signed up, email not verified. ${anno("FR-19 · §9.2")}</p></div>
    <div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Account</th><th>Bookings</th><th>Upcoming</th><th>Zone</th></tr></thead><tbody>
    ${list.map(p => { const st = parentStatus(p); const bs = DB.bookings.filter(b => b.email === p.email);
      return `<tr><td><a href="#/admin/parents/${encodeURIComponent(p.email)}">${esc(p.name)}</a></td><td>${esc(p.email)}</td><td>${st === "VERIFIED" ? `<span class="chip chip-open">Verified</span>` : st === "PENDING" ? `<span class="chip chip-pending">Pending</span>` : `<span class="chip chip-closed">Guest</span>`}</td><td class="tnum">${bs.length}</td><td class="tnum">${bs.filter(b => b.status === "CONFIRMED" && b.start > DB.now).length}</td><td>${esc(ZONE_NAMES[p.tz] || p.tz)}</td></tr>`; }).join("")}</tbody></table></div>`);
}
function viewAdminParent(email) {
  const p = DB.parents[email];
  if (!p) return adminShell("parents", `<div class="empty"><strong>Parent not found.</strong><a href="#/admin/parents">Back to parents</a></div>`);
  const st = parentStatus(p);
  return adminShell("parents", `<a href="#/admin/parents" class="small">← Parents</a><div class="stack" style="gap:4px"><h1>${esc(p.name)}</h1><p class="muted">${esc(p.email)}${p.phone ? " · " + esc(p.phone) : ""} · ${esc(zoneLabel(p.tz, DB.now))}</p></div>
    <div class="row">${st === "VERIFIED" ? `<span class="chip chip-open">Verified account</span>` : st === "PENDING" ? `<span class="chip chip-pending">Pending verification</span>` : `<span class="chip chip-closed">Guest (no account)</span>`}</div>
    <h2>Bookings</h2>${bookingTable(DB.bookings.filter(b => b.email === email).sort((a, b) => b.start - a.start))}`);
}
function shiftText(m) { const s = SHIFTS[m.shift]; return `${fmtMinutes(s.start)} – ${fmtMinutes(s.end)}`; }
function meter(n, max) { return `<span class="meter ${n >= max ? "full" : ""}" role="img" aria-label="${n} of ${max} trials">${Array.from({ length: max }, (_, i) => `<i class="${i < n ? "on" : ""}"></i>`).join("")}<span class="small tnum" style="margin-left:4px">${n} / ${max}</span></span>`; }
function viewAdminMentors() {
  const today = localDate(DB.now, IST), wd = parts(DB.now, IST).wd;
  return adminShell("mentors", `<div class="stack" style="gap:4px"><h1>Mentors</h1><p class="muted">Today in India: ${esc(fmtDayLong(DB.now, IST))}</p></div>
    <div class="table-wrap"><table><thead><tr><th>Mentor</th><th>Shift (India time)</th><th>Day off</th><th>Today</th><th>Upcoming</th></tr></thead><tbody>
    ${MENTORS.map(m => `<tr><td><a href="#/admin/mentors/${m.id}">${esc(m.name)}</a><div class="sub">${esc(m.bio)}</div></td><td>${SHIFTS[m.shift].label}<div class="sub">${shiftText(m)}</div></td><td>${WD_NAMES[m.off]}</td>
      <td>${m.off === wd ? `<span class="chip chip-closed">Day off</span>` : meter(dayCount(m, today), CFG.cap)}</td><td class="tnum">${confirmed().filter(b => b.mentorId === m.id && b.start > DB.now).length}</td></tr>`).join("")}</tbody></table></div>`);
}
function viewAdminMentor(id) {
  const m = mentorById(id);
  if (!m) return adminShell("mentors", `<div class="empty"><strong>Mentor not found.</strong></div>`);
  const ds = istDates(14);
  return adminShell("mentors", `<a href="#/admin/mentors" class="small">← Mentors</a>
    <div class="mentor"><div class="avatar">${initials(m.name)}</div><div><h1>${esc(m.name)}</h1><p class="muted">${SHIFTS[m.shift].label} · ${esc(m.bio)}</p></div></div>
    <div class="card stack"><div class="spread"><h2>Weekly shift</h2><span class="small muted">India Standard Time (UTC+05:30)</span></div>
      <div class="week">${[1, 2, 3, 4, 5, 6, 7].map(d => `<div class="${d === m.off ? "" : "on"}"><b>${WD_NAMES[d]}</b>${d === m.off ? "Off" : shiftText(m)}</div>`).join("")}</div></div>
    <div class="card"><div class="spread" style="margin-bottom:8px"><h2>Schedule, next 14 India dates</h2>${anno("FR-19 · C3")}</div>
      ${ds.map(d => { const wd = parts(zonedToUtc(d, 720, IST), IST).wd; const bs = confirmed().filter(b => b.mentorId === m.id && b.istDate === d).sort((a, b) => a.start - b.start);
        return `<div class="sched-day"><div class="stack" style="gap:4px"><strong>${esc(fmtDay(zonedToUtc(d, 720, IST), IST))}</strong>${wd === m.off ? `<span class="chip chip-closed" style="align-self:flex-start">Day off</span>` : meter(bs.length, CFG.cap)}</div>
          <div class="stack" style="gap:8px">${bs.length ? bs.map(b => `<div class="spread"><div><strong class="tnum">${esc(fmtTime(b.start, IST))}</strong> · ${esc(b.child)} (Grade ${b.grade}, ${b.subject === "CODING" ? "Coding" : "Maths"})<div class="small muted">Parent's time: ${esc(fmtSlot(b.start, b.tz))} · ${esc(b.parentName)}</div></div><a class="btn btn-secondary btn-sm" href="#/booking/${b.ref}">Open</a></div>`).join("") : `<span class="small muted">${wd === m.off ? "" : "No trials booked."}</span>`}</div></div>`; }).join("")}</div>`);
}
function outboxList(limit) {
  const msgs = DB.outbox.slice(0, limit);
  if (!msgs.length) return `<div class="empty"><strong>No messages yet.</strong></div>`;
  return `<div class="stack">${msgs.map(o => `<article class="outbox-msg"><div class="spread"><span class="chip chip-info mono">${o.kind}</span><span class="small muted">to ${esc(o.to)}</span></div><strong>${esc(o.subject)}</strong>
    <div class="body">${esc(o.body).replace(/(#\/[^\s]+)/g, '<a href="$1">$1</a>').replace(/(https:\/\/meet\.example\.com\/[^\s]+)/g, '<span class="mono">$1</span>')}</div></article>`).join("")}</div>`;
}
function viewAdminOutbox() { return adminShell("outbox", `<div class="stack" style="gap:4px"><h1>Outbox</h1><p class="muted">Every message the system would email: booking confirmations and cancellations for parents and mentors, and account emails. ${anno("FR-9")}</p></div>${outboxList(80)}`); }
function viewDevOutbox() {
  return publicShell(`<div class="stack-lg"><div class="stack" style="gap:4px"><span class="eyebrow">Development only</span><h1>Dev outbox</h1><p class="muted">This app doesn't send real email. Messages land here so you can click verification, reset and manage links. ${anno("FR-20")}</p></div>${outboxList(60)}</div>`);
}

/* ---------- dialog ---------- */
function confirmDialog(title, body, okLabel, onOk) {
  const root = $("#dialog-root");
  root.innerHTML = `<div class="scrim" data-act="dlg-close"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-t"><h2 id="dlg-t">${title}</h2><p class="muted">${body}</p><div class="row" style="justify-content:flex-end"><button class="btn btn-secondary" data-act="dlg-close">Keep it</button><button class="btn btn-danger" id="dlg-ok">${okLabel}</button></div></div></div>`;
  $("#dlg-ok").onclick = () => { root.innerHTML = ""; onOk(); };
  $("#dlg-ok").focus();
}

/* ---------- render ---------- */
function render() {
  const r = route(), [a, b, c] = r.parts;
  let html;
  if (!a) html = viewMap();
  else if (a === "book") html = viewBook();
  else if (a === "booking") html = viewBooking(b, r.q);
  else if (a === "signup") html = viewSignup(r.q);
  else if (a === "verify-email") html = viewVerify(r.q);
  else if (a === "login") html = viewLogin(r.q);
  else if (a === "forgot-password") html = viewForgot(r.q);
  else if (a === "reset-password") html = viewReset(r.q);
  else if (a === "my-bookings") html = S.session.parent ? viewMyBookings() : (setTimeout(() => go("#/login?next=my-bookings"), 0), "");
  else if (a === "dev" && b === "outbox") html = viewDevOutbox();
  else if (a === "admin" && b === "login") html = viewAdminLogin(r.q);
  else if (a === "admin") {
    if (!S.session.admin) { setTimeout(() => go("#/admin/login"), 0); html = ""; }
    else if (!b) html = viewAdminDash();
    else if (b === "bookings") html = viewAdminBookings();
    else if (b === "parents") html = c ? viewAdminParent(decodeURIComponent(c)) : viewAdminParents();
    else if (b === "mentors") html = c ? viewAdminMentor(c) : viewAdminMentors();
    else if (b === "outbox") html = viewAdminOutbox();
  }
  $("#app").innerHTML = html || viewMap();
  $("#pb-outbox-count").textContent = DB.outbox.length;
  const F = S.adminFilters;
  for (const k of ["scope", "status", "mentor"]) { const el = document.querySelector(`[data-filter="${k}"]`); if (el) el.value = F[k]; }
}
window.addEventListener("hashchange", () => { $("#dialog-root").innerHTML = ""; render(); window.scrollTo(0, 0); });

/* ---------- events ---------- */
const actions = {
  reset() { seed($("#pb-date").value); S.book = null; S.attempts = {}; toast("Demo data reset"); render(); },
  "tz-toggle"() { S.tzOpen = !S.tzOpen; S.tzFilter = ""; render(); if (S.tzOpen) $("#tz-search").focus(); },
  "tz-pick"(el) { S.chosenTz = el.dataset.tz; S.tzOpen = false; S.tzFilter = ""; if (S.book) { S.book.date = null; S.book.sugg = null; } toast(`Times now in ${ZONE_NAMES[el.dataset.tz] || el.dataset.tz}`); render(); },
  "pick-day"(el) { S.book.date = el.dataset.d; S.book.sugg = null; S.book.lead = ""; render(); },
  "pick-slot"(el) { Object.assign(S.book, { sel: +el.dataset.s, step: 2, sugg: null, lead: "", errors: {}, existing: null }); render(); window.scrollTo(0, 0); },
  "full-slot"(el) { const tz = parentTz(), s = +el.dataset.s, p = parts(s, tz); S.book.sugg = suggest(tz, p.date, p.min, s); S.book.suggFrom = s; S.book.lead = ""; render(); const x = $("#sugg"); if (x) x.focus(); },
  "pick-sugg"(el) { const s = +el.dataset.s, tz = parentTz(); Object.assign(S.book, { sel: s, step: 2, sugg: null, lead: "", existing: null, date: localDate(s, tz) }); toast(`Selected ${fmtSlot(s, tz)}`); render(); window.scrollTo(0, 0); },
  "change-time"() { Object.assign(S.book, { step: 1, sugg: null, lead: "" }); const f = document.querySelector('[data-form="book"]'); if (f) Object.assign(S.book.form, Object.fromEntries(new FormData(f))); render(); },
  subject(el) { const f = document.querySelector('[data-form="book"]'); if (f) Object.assign(S.book.form, Object.fromEntries(new FormData(f))); S.book.form.subject = el.dataset.v; delete S.book.errors.subject; render(); },
  "new-book"() { S.book = null; },
  copy(el) { try { navigator.clipboard.writeText(el.dataset.v).then(() => toast("Link copied"), () => toast("Link copied")); } catch { toast("Link copied"); } },
  ics() { toast("Downloads an .ics file in the real app (blocked in this prototype)"); },
  gcal() { toast("Opens Google Calendar with the class pre-filled"); },
  cancel(el) {
    const ref = el.dataset.ref, by = el.dataset.by || (S.session.admin && location.hash.startsWith("#/admin") ? "ADMIN" : "PARENT");
    const b = DB.bookings.find(x => x.ref === ref);
    confirmDialog("Cancel this trial?", `${esc(b.child)}'s class on ${esc(fmtSlot(b.start, by === "ADMIN" ? IST : b.tz))} will be cancelled and the ${by === "ADMIN" ? "parent and mentor" : "mentor"} will be told. The time becomes free for other families.`, "Cancel trial", () => {
      const r = cancelBooking(ref, by); toast(r.error === "ALREADY_STARTED" ? "This class has already started and can't be cancelled." : "Trial cancelled"); render();
    });
  },
  "dlg-close"(el, e) { if (el.classList.contains("scrim") && e.target !== el) return; $("#dialog-root").innerHTML = ""; },
  "parent-logout"() { S.session.parent = null; toast("Signed out"); go("#/book"); },
  "admin-logout"() { S.session.admin = null; toast("Signed out"); go("#/admin/login"); },
  "my-tab"(el) { S.myTab = el.dataset.v; render(); },
  resend(el) { const p = DB.parents[el.dataset.email]; if (parentStatus(p) === "PENDING") { const t = issueToken(p.email, "VERIFY_EMAIL", 24); outbox("VERIFY_EMAIL", p.email, "Verify your email", `Here's a new link to verify your email.\nVerify: #/verify-email?token=${t}`); } toast("If that account is waiting for verification, we've sent a new link"); render(); },
  "as-guest"() { setPersona("guest"); },
  "as-admin"() { setPersona("admin"); },
  "edge-full-slot"() { setPersona("guest", true); S.chosenTz = "America/New_York"; S.book = freshBook(); S.book.date = addDays(todayLocal("America/New_York"), 2); go("#/book"); },
  "edge-full-day"() { setPersona("guest", true); S.chosenTz = "America/New_York"; S.book = freshBook(); S.book.date = addDays(todayLocal("America/New_York"), 4); go("#/book"); },
  "edge-race"() { $("#pb-race").checked = true; setPersona("guest", true); S.book = freshBook(); go("#/book"); toast("Race is on: pick any open slot and book"); },
  "edge-soon"() { $("#pb-soon").checked = true; setPersona("guest", true); S.book = freshBook(); go("#/book"); toast("Too-soon is on: pick any open slot and book"); },
  "edge-active"() { setPersona("guest", true); S.book = freshBook(); S.book.form = { email: "demo.parent@example.com", name: "Emma Clarke", child: "Freddie", grade: "4", subject: "CODING" }; go("#/book"); toast("Pick a slot; the form is pre-filled with demo.parent@example.com"); },
  "edge-dst"() { $("#pb-date").value = "2026-10-20"; seed("2026-10-20"); setPersona("guest", true); S.chosenTz = "America/New_York"; S.book = freshBook(); go("#/book"); },
  "edge-tz"() { $("#pb-tz").value = ""; S.browserTz = ""; S.chosenTz = null; setPersona("guest", true); go("#/book"); },
  "edge-cap"() { setPersona("admin"); go("#/admin/mentors"); },
  "edge-pending"() { setPersona("pending"); },
  "edge-login"() { setPersona("guest", true); go("#/login?email=demo.parent%40example.com"); },
  "edge-outbox"() { go("#/dev/outbox"); },
  "edge-badtoken"() { const b = DB.bookings.find(x => x.status === "CONFIRMED"); go(`#/booking/${b.ref}?token=wrong`); }
};
function setPersona(v, stay) {
  $("#pb-persona").value = v;
  S.session.parent = v === "parent" ? "demo.parent@example.com" : null;
  S.session.admin = v === "admin" ? true : null;
  S.book = null;
  if (stay) return;
  go(v === "admin" ? "#/admin" : v === "parent" ? "#/my-bookings" : v === "pending" ? "#/login?email=pending.parent%40example.com" : "#/book");
}
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const fn = actions[el.dataset.act];
  if (!fn) return;
  if (el.tagName === "BUTTON" || el.dataset.act === "dlg-close") e.preventDefault();
  fn(el, e);
});
document.addEventListener("input", e => {
  if (e.target.id === "tz-search") { S.tzFilter = e.target.value; const pos = e.target.selectionStart; render(); const i = $("#tz-search"); i.focus(); i.setSelectionRange(pos, pos); }
  if (e.target.dataset.filter === "q") { S.adminFilters.q = e.target.value; const pos = e.target.selectionStart; render(); const i = $("#af-q"); i.focus(); i.setSelectionRange(pos, pos); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.filter && t.dataset.filter !== "q") { S.adminFilters[t.dataset.filter] = t.value; render(); }
  if (t.id === "pb-persona") setPersona(t.value);
  if (t.id === "pb-date") { seed(t.value); S.book = null; toast(`Today is now ${t.options[t.selectedIndex].text}`); render(); }
  if (t.id === "pb-tz") { S.browserTz = t.value; S.chosenTz = null; S.tzOpen = false; if (S.book) { S.book.date = null; S.book.sugg = null; } render(); }
  if (t.id === "pb-annos") document.body.classList.toggle("annos", t.checked);
});
const forms = {
  book: f => submitBook(f),
  signup(f) {
    const d = Object.fromEntries(new FormData(f)), email = (d.email || "").trim().toLowerCase(), err = $("#su-err");
    const msg = !d.name || d.name.trim().length < 2 ? "Please enter your name" : !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) ? "Please enter a valid email" : (d.password || "").length < 8 ? "Use at least 8 characters" : d.password.toLowerCase() === email ? "Password can't be your email" : "";
    if (msg) { err.textContent = msg; err.hidden = false; return; }
    signup(d.name.trim(), email, d.password); S.lastSignupEmail = email; go("#/signup?sent=1");
  },
  login(f) {
    const d = Object.fromEntries(new FormData(f)), email = (d.email || "").trim().toLowerCase();
    const k = email || "_"; const at = S.attempts[k] = (S.attempts[k] || []).filter(t => Date.now() - t < 60000);
    const box = $("#login-msg");
    if (at.length >= 5) { box.innerHTML = loginMsg("rate"); return; }
    const p = DB.parents[email];
    if (!p || !p.password || p.password !== d.password) { at.push(Date.now()); box.innerHTML = loginMsg("bad"); return; }
    if (!p.verified) { box.innerHTML = loginMsg("pending", email); return; }
    S.session.parent = email; S.attempts[k] = []; $("#pb-persona").value = email === "demo.parent@example.com" ? "parent" : "guest";
    toast(`Signed in as ${p.name}`); go("#/my-bookings");
  },
  resend(f) { const email = (new FormData(f).get("email") || "").trim().toLowerCase(); actions.resend({ dataset: { email } }); },
  forgot(f) {
    const email = (new FormData(f).get("email") || "").trim().toLowerCase(), p = DB.parents[email];
    if (p && p.password) { const t = issueToken(email, "RESET_PASSWORD", 1); outbox("RESET_PASSWORD", email, "Reset your password", `Use this link to set a new password. It works for 1 hour.\nReset: #/reset-password?token=${t}`); }
    go("#/forgot-password?sent=1");
  },
  reset(f) {
    const pw = new FormData(f).get("password") || "", r = useToken(f.dataset.token, "RESET_PASSWORD");
    if (pw.length < 8) { const e = $("#rp-err"); e.textContent = "Use at least 8 characters"; e.hidden = false; if (r) r.used = false; return; }
    if (!r) { render(); return; }
    const p = DB.parents[r.email]; p.password = pw; p.verified = true; if (S.session.parent === r.email) S.session.parent = null;
    toast("Password updated. Please sign in."); go(`#/login?email=${encodeURIComponent(r.email)}`);
  },
  "admin-login"(f) {
    const d = Object.fromEntries(new FormData(f)); const k = "admin"; const at = S.attempts[k] = (S.attempts[k] || []).filter(t => Date.now() - t < 60000);
    if (at.length >= 5) { $("#al-msg").innerHTML = loginMsg("rate"); return; }
    if (d.email.trim().toLowerCase() !== ADMIN.email || d.password !== ADMIN.password) { at.push(Date.now()); $("#al-msg").innerHTML = loginMsg("bad"); return; }
    S.session.admin = true; $("#pb-persona").value = "admin"; go("#/admin");
  }
};
document.addEventListener("submit", e => { const f = e.target; if (!f.dataset.form) return; e.preventDefault(); forms[f.dataset.form](f); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#dialog-root").innerHTML) $("#dialog-root").innerHTML = ""; });

/* ---------- boot ---------- */
document.body.classList.add("annos");
seed($("#pb-date").value);
S.browserTz = $("#pb-tz").value;
render();
</script>
